<!doctype html><html><head><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catalog search index rebuild</title></head><body><h1>Catalog search index rebuild</h1><p>Admin only. Stop catalog search-field changes during migration. This page changes search index chunks only, never products, stock, prices, orders or payment.</p><button id="review">Read current products and review</button><button id="publish" disabled>Publish reviewed search chunks</button><pre id="status">No reads or writes yet.</pre><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
import{getAuth}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
import{getFirestore,collection,getDocsFromServer,doc,getDocFromServer,runTransaction}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';
import{CHUNK_COUNT,INDEX_COLLECTION,INDEX_VERSION,chunkId,searchEntry,sameEntry}from'./catalog-index-core.mjs';
const config={
  "projectId": "udecs-store",
  "appId": "1:859203239571:web:9ebdafe1c6a28ad2a41766",
  "apiKey": "AIzaSyANRNCASxjGE-IZSLdCws_6W4VpjemO1aI",
  "authDomain": "udecs-store.firebaseapp.com",
  "storageBucket": "udecs-store.firebasestorage.app",
  "messagingSenderId": "859203239571",
  "measurementId": "G-C4ER2KX5SD",
  "oAuthClientId": "859203239571-o53emdth2bfi7hlmt5dsscplm4f8j4sh.apps.googleusercontent.com",
  "recaptchaSiteKey": ""
}
;
const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app);
const status=document.getElementById('status');const publish=document.getElementById('publish');let reviewed=null,busy=false,confirmed=false;
function owner(){const u=auth.currentUser;if(!u?.emailVerified||!['ecommerceunickdigital@gmail.com','sksaharukhossain1996@gmail.com'].includes((u.email||'').toLowerCase()))throw Error('Existing authorized admin session required. No sign-in is initiated here.');return u.uid;}
document.getElementById('review').onclick=async()=>{if(busy)return;busy=true;publish.disabled=true;try{await auth.authStateReady();const uid=owner();const snap=await getDocsFromServer(collection(db,'products'));const products=snap.docs.map(d=>({id:d.id,data:d.data()}));const chunks=Array.from({length:CHUNK_COUNT},(_,n)=>({id:String(n).padStart(2,'0'),version:INDEX_VERSION,entries:[]}));for(const p of products){const entry=searchEntry(p.id,p.data);if(entry)chunks[Number(chunkId(p.id))].entries.push(entry);}for(const c of chunks){c.entries.sort((a,b)=>a.id<b.id?-1:a.id>b.id?1:0);if(new TextEncoder().encode(JSON.stringify(c)).length>700000)throw Error('Chunk capacity exceeded');}reviewed={uid,products,chunks};status.textContent=`Reviewed ${products.length} products, ${chunks.reduce((n,c)=>n+c.entries.length,0)} public search entries,16 chunks. No writes. Publish requires a catalog-mutation freeze.`;publish.disabled=false;}catch(e){reviewed=null;status.textContent='Read blocked: '+e.message+'. Stop on quota/access errors; do not repeat reads.';}finally{busy=false;}};
publish.onclick=async()=>{if(busy||!reviewed)return;if(!confirmed){confirmed=true;publish.textContent='Confirm publish 16 reviewed search chunks';status.textContent+=' Confirm only while catalog edits remain frozen.';return;}busy=true;publish.disabled=true;try{if(owner()!==reviewed.uid)throw Error('Owner changed');for(const chunk of reviewed.chunks){const baseline=reviewed.products.filter(p=>chunkId(p.id)===chunk.id);await runTransaction(db,async tx=>{if(owner()!==reviewed.uid)throw Error('Owner changed');const current=await Promise.all(baseline.map(p=>tx.get(doc(db,'products',p.id))));current.forEach((d,n)=>{const p=baseline[n];if(!d.exists()||!sameEntry(searchEntry(p.id,d.data()),searchEntry(p.id,p.data)))throw Error('Product search fields changed. Stop and re-review.');});const {id,...fields}=chunk;tx.set(doc(db,INDEX_COLLECTION,id),fields);});const after=await getDocFromServer(doc(db,INDEX_COLLECTION,chunk.id));if(!after.exists()||after.data().version!==INDEX_VERSION||JSON.stringify(after.data().entries)!==JSON.stringify(chunk.entries))throw Error('Chunk readback differs');status.textContent='Published and verified chunk '+chunk.id;}status.textContent='All16 chunks published and verified. Verify storefront before lifting catalog mutation freeze.';}catch(e){status.textContent='STOPPED: '+e.message+'. Partial migration possible; do not enable storefront until all16 chunks verified.';}finally{busy=false;reviewed=null;}};
</script></body></html>
