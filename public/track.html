<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order Tracking | UDECS.STORE</title>
<style>
  :root{
    --navy:#16265c; --navy2:#1d3a8f; --gold:#f5a623; --blue:#1d4ed8; --blue2:#2563eb;
    --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --bg:#f1f5f9;
    --green:#16a34a; --greenbg:#dcfce7; --orange:#d97706; --grey:#94a3b8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}
  /* header */
  header{background:linear-gradient(90deg,#0d1b4c,#1d3a8f);color:#fff;padding:0 28px}
  .hwrap{max-width:1200px;margin:auto;display:flex;align-items:center;gap:26px;height:74px}
  .logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
  .logo .mark{width:40px;height:40px;background:linear-gradient(135deg,#f5a623,#f97316);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;color:#fff}
  .logo .markimg{width:44px;height:44px;border-radius:10px;object-fit:cover;box-shadow:0 2px 8px rgba(0,0,0,.25)}
  .logo b{font-size:23px;letter-spacing:.5px}.logo b span{color:var(--gold)}
  .logo small{display:block;font-size:10.5px;color:#c7d2fe;font-weight:400;letter-spacing:.4px}
  nav{display:flex;gap:22px;margin-left:8px;flex:1}
  nav a{color:#dbe4ff;text-decoration:none;font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:6px;padding:6px 2px;border-bottom:2.5px solid transparent}
  nav a.active{color:#fff;border-bottom-color:var(--gold)}
  nav a:hover{color:#fff}
  .hsearch{background:#fff;border-radius:8px;display:flex;align-items:center;padding:8px 14px;gap:8px;width:230px}
  .hsearch input{border:0;outline:0;font-size:13.5px;width:100%;color:#334155}
  .langsel{background:#fff;border:0;border-radius:8px;padding:9px 10px;font-size:13px;font-weight:600;color:#1e293b;cursor:pointer;outline:0}
  .cart{position:relative;color:#fff;font-size:22px}
  .cart i{position:absolute;top:-7px;right:-9px;background:#ef4444;color:#fff;font-style:normal;font-size:10.5px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center}
  /* hero */
  .hero{background:linear-gradient(120deg,#dbeafe 0%,#bfdbfe 55%,#93c5fd 100%);padding:34px 28px 40px}
  .heroin{max-width:1200px;margin:auto;display:flex;align-items:center;gap:30px}
  .hero h1{font-size:34px;color:#0f2a6d;font-weight:800}
  .hero p{font-size:19px;color:#1e3a8a;margin-top:6px;font-weight:600}
  .hero .art{margin-left:auto;font-size:64px}
  /* card */
  .wrap{max-width:760px;margin:-24px auto 40px;padding:0 18px}
  .card{background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(15,42,109,.10);padding:30px 34px 34px}
  .card h2{text-align:center;font-size:24px;font-weight:800;color:var(--ink)}
  .card .sub{text-align:center;color:var(--muted);font-size:14.5px;margin:8px 0 22px}
  .frow{display:flex;gap:14px}
  .field{flex:1;display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;background:#fff}
  .field:focus-within{border-color:var(--blue2)}
  .field input{border:0;outline:0;width:100%;font-size:14.5px;color:var(--ink)}
  .field .ic{font-size:17px;color:#94a3b8}
  .trackbtn{width:100%;margin-top:18px;background:var(--blue2);color:#fff;border:0;border-radius:10px;padding:14px;font-size:16.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px}
  .trackbtn:hover{background:var(--blue)}
  .err{margin-top:14px;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:9px;padding:11px 14px;font-size:13.5px;display:none}
  /* result */
  .result{margin-top:26px;border:1.5px solid #bbf7d0;background:#f0fdf4;border-radius:14px;padding:22px 24px;display:none}
  .rhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .rhead .ok{width:34px;height:34px;background:var(--green);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px}
  .rhead h3{font-size:19px;font-weight:800}
  .pill{margin-left:auto;color:#fff;font-size:13px;font-weight:700;padding:6px 16px;border-radius:20px;display:flex;align-items:center;gap:6px}
  .pill.delivered{background:var(--green)} .pill.shipped{background:#2563eb} .pill.processing,.pill.packed{background:var(--orange)} .pill.pending{background:#64748b} .pill.cancelled{background:#dc2626}
  .meta{display:flex;gap:10px;flex-wrap:wrap;color:#334155;font-size:13.5px;margin:14px 0 6px}
  .meta span{display:flex;align-items:center;gap:6px}
  .meta b{color:#0f172a}
  /* timeline */
  .tl{display:flex;align-items:flex-start;margin-top:22px}
  .step{flex:1;text-align:center;position:relative}
  .step .dot{width:46px;height:46px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:20px;background:#e2e8f0;color:#94a3b8;position:relative;z-index:2}
  .step.done .dot{background:var(--green);color:#fff}
  .step.current .dot{background:var(--blue2);color:#fff;box-shadow:0 0 0 5px #bfdbfe}
  .step:not(:first-child)::before{content:'';position:absolute;top:23px;left:-50%;width:100%;height:3px;background:#e2e8f0;z-index:1}
  .step.done:not(:first-child)::before{background:var(--green)}
  .step h4{font-size:13px;font-weight:700;margin-top:10px;color:#0f172a}
  .step small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
  .cur{display:inline-block;margin-top:5px;background:var(--blue2);color:#fff;font-size:10.5px;font-weight:700;padding:2px 10px;border-radius:10px}
  .note{display:flex;gap:10px;align-items:flex-start;background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:13px 15px;margin-top:22px;font-size:13.5px;color:#1e3a8a}
  .courierbtn{display:inline-flex;align-items:center;gap:8px;margin-top:16px;background:var(--blue2);color:#fff;text-decoration:none;font-size:14px;font-weight:700;padding:11px 18px;border-radius:9px}
  /* footer strip */
  .strip{background:linear-gradient(90deg,#0d1b4c,#1d3a8f);color:#fff;margin-top:44px}
  .stripin{max-width:1200px;margin:auto;display:flex;align-items:center;gap:8px;padding:20px 28px;flex-wrap:wrap}
  .feat{display:flex;align-items:center;gap:11px;padding:0 26px}
  .feat .fi{font-size:26px}
  .feat b{font-size:14px;display:block}
  .feat small{color:#c7d2fe;font-size:11.5px}
  .striplogo{margin-left:auto;text-align:right}
  .striplogo b{font-size:19px}.striplogo b span{color:var(--gold)}
  .striplogo small{display:block;color:#c7d2fe;font-size:11px}
  .conf{background:var(--blue2);border-radius:12px;color:#fff;padding:14px 22px;font-size:14.5px;font-weight:700;display:flex;gap:10px;align-items:center;margin-top:4px}
  @media(max-width:760px){
    nav{display:none}
    .hsearch{display:none}
    .hero h1{font-size:26px}.hero p{font-size:15.5px}.hero .art{font-size:44px}
    .frow{flex-direction:column}
    .card{padding:24px 18px}
    .tl{flex-direction:column;gap:4px}
    .step{display:flex;align-items:center;gap:13px;text-align:left;padding:5px 0}
    .step .dot{width:34px;height:34px;font-size:15px;flex-shrink:0;margin:0}
    .step:not(:first-child)::before{display:none}
    .step h4{font-size:13px;margin-top:0}
    .step small{display:inline;margin-left:6px}
    .feat{padding:8px 12px}
    .striplogo{margin-left:0;text-align:left}
  }
</style>
</head>

let lang = new URLSearchParams(location.search).get('lang') || localStorage.getItem('udecs-lang') || 'en';
if (!I18N[lang]) lang = 'en';
let T = I18N[lang];
let lastOrder = null;
function applyLang(){
  T = I18N[lang];
  document.documentElement.lang = lang;
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  set('t_heroTitle', T.heroTitle); set('t_heroSub', T.heroSub);
  set('t_cardTitle', T.cardTitle); set('t_cardSub', T.cardSub);
  set('t_trackBtn', T.trackBtn); set('t_courierBtn', T.courierBtn);
  set('t_f1b', T.f1b); set('t_f1s', T.f1s);
  set('t_f2b', T.f2b); set('t_f2s', T.f2s);
  set('t_f3b', T.f3b); set('t_f3s', T.f3s);
  set('t_conf', T.conf); set('t_storeTag', T.storeTag);
  document.getElementById('oid').placeholder = T.oidPh;
  document.getElementById('mob').placeholder = T.mobPh;
  document.getElementById('langSel').value = lang;
}
const fmtD = d => d.toLocaleDateString(T.locale, {day:'numeric', month:'long', year:'numeric'});
document.getElementById('langSel').addEventListener('change', ev => {
  lang = ev.target.value;
  localStorage.setItem('udecs-lang', lang);
  applyLang();
  if (lastOrder) render(lastOrder);
});
applyLang();

  {key:'confirmed', label:'Order Confirmed', icon:'<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.14em"><polyline points="20 6 9 17 4 12"/></svg>'},
  {key:'processing',label:'Processing',      icon:'<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.14em"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>'},
  {key:'shipped',   label:'Shipped',         icon:'<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.14em"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>'},
  {key:'delivered', label:'Delivered',       icon:'<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.14em"><polyline points="20 6 9 17 4 12"/></svg>'}
];
const RANK = {pending:0, processing:1, packed:2, shipped:3, delivered:4};
const COURIER_LINKS = [
  [/delhivery/i, tn => 'https://www.delhivery.com/track/package/' + tn],
  [/dtdc/i, tn => 'https://www.dtdc.in/tracking/tracking_results.asp?Ttype=awb_no&strCnno=' + tn],
  [/bluedart/i, tn => 'https://www.bluedart.com/tracking?trackFor=0&trackingNo=' + tn],
  [/ekart/i, tn => 'https://ekartlogistics.com/shipmenttrack/' + tn],
  [/xpressbees/i, tn => 'https://www.xpressbees.com/shipment/tracking?awbno=' + tn]
];

function stageIndex(o){
  if (o.orderStatus === 'cancelled') return -1;
  let r = RANK[o.orderStatus] ?? 0;
  if (r === 0 && o.paymentStatus === 'paid') r = 1;
  return r;
}
function showError(msg){
  const e = document.getElementById('err');
  e.textContent = msg; e.style.display = 'block';
  document.getElementById('res').style.display = 'none';
}
function render(o){
  lastOrder = o;
  document.getElementById('err').style.display = 'none';
  const res = document.getElementById('res');
  document.getElementById('rTitle').textContent = T.orderPrefix + o.orderId;
  const pill = document.getElementById('rPill');
  const st = o.orderStatus;
  pill.className = 'pill ' + st;
  pill.innerHTML = (st === 'cancelled' ? '<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.14em"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> ' : '') + (T.status[st] || st);
  const placed = new Date(o.createdAt), updated = new Date(o.updatedAt || o.createdAt);
  const meta = document.getElementById('rMeta');
  meta.innerHTML = '';
  const items = [
    ['<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.14em"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>', T.dateLabel + fmtD(placed)],
    ['<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.14em"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>', T.courierLabel, o.courierName || T.notAssigned],
    ['<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.14em"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>', T.trackingLabel, o.trackingNumber || T.notAssigned]
  ];
  items.forEach(([ic, label, val]) => {
    const s = document.createElement('span');
    s.innerHTML = ic + ' <b>' + label + (val ? val : '') + '</b>';
    meta.appendChild(s);
  });
  const tl = document.getElementById('rTl');
  tl.innerHTML = '';
  const cur = stageIndex(o);
  STAGES.forEach((sg, i) => {
    const div = document.createElement('div');
    let cls = 'step';
    if (cur === -1) cls += '';
    else if (i < cur) cls += ' done';
    else if (i === cur) cls += (st === 'delivered' ? ' done current' : ' current');
    div.className = cls;
    let dateTxt = '';
    if (cur !== -1) {
      if (i === 0) dateTxt = fmtD(placed);
      else if (i === cur) dateTxt = fmtD(updated);
    }
    div.innerHTML = '<div class="dot">' + (i < cur || (i === cur && st === 'delivered') ? '<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.14em"><polyline points="20 6 9 17 4 12"/></svg>' : sg.icon) + '</div>' +
      '<h4>' + T.stages[sg.key] + '</h4>' +
      (dateTxt ? '<small>' + dateTxt + '</small>' : (i > cur && cur !== -1 ? '<small>' + T.pendingTag + '</small>' : '')) +
      (i === cur && st !== 'delivered' && cur !== -1 ? '<span class="cur">' + T.currentStatus + '</span>' : '');
    tl.appendChild(div);
  });
  const note = document.getElementById('rNote');
  const notes = T.notes;
  note.innerHTML = '<span style="font-size:17px"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.14em"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></span><span>' + (notes[st] || notes.pending) + '</span>';
  const cb = document.getElementById('rCourier');
  if (o.courierName && o.trackingNumber) {
    const rule = COURIER_LINKS.find(([re]) => re.test(o.courierName));
    if (rule) { cb.href = rule[1](encodeURIComponent(o.trackingNumber)); cb.style.display = 'inline-flex'; }
    else cb.style.display = 'none';
  } else cb.style.display = 'none';
  res.style.display = 'block';
}

async function track(oid, mob){
  const r = await fetch(API_BASE + '/api/orders/track', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({orderId: oid, mobile: mob})
  });
  const d = await r.json().catch(() => ({}));
  if (r.status === 429) throw Error(T.tooMany);
  if (r.status === 503) throw Error(T.unavailable);
  if (!r.ok || !d.order) throw Error(T.notFound);
  return d.order;
}

document.getElementById('f').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const oid = document.getElementById('oid').value.trim();
  const mob = document.getElementById('mob').value.trim();
  if (!/^UDECS-[A-Za-z0-9-]{3,64}$/.test(oid)) return showError(T.errId);
  const digits = mob.replace(/\D/g, '');
  if (digits.length < 10) return showError(T.errMob);
  const btn = document.querySelector('.trackbtn');
  btn.disabled = true; btn.textContent = T.checking;
  try { render(await track(oid, digits.slice(-10))); }
  catch (e) { showError(e.message); }
  finally { btn.disabled = false; btn.innerHTML = '<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.14em"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg> <span id=\"t_trackBtn\">' + T.trackBtn + '</span>'; }
});
