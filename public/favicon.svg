    <!-- Golden Arrow Swoop -->
    <path d="M 130 300 C 180 320, 240 290, 310 230 C 360 190, 400 130, 445 70 L 415 60 L 485 40 L 475 110 L 448 95 C 410 150, 365 210, 300 260 C 235 310, 175 325, 130 300 Z"
          fill="url(#favGold)"/>
    <!-- Wheels -->
    <circle cx="225" cy="375" r="25" fill="url(#favNavy)"/>
    <circle cx="375" cy="375" r="25" fill="url(#favNavy)"/>
  </g>
  <!-- Text snippet -->
  <text x="256" y="475" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-weight="900" font-size="70" fill="#1B365D" letter-spacing="4">UDECS</text>
</svg>
