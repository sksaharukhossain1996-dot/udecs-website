<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="favNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B365D" />
      <stop offset="100%" stop-color="#0E2138" />
    </linearGradient>
    <linearGradient id="favGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E27318" />
      <stop offset="100%" stop-color="#FDB43A" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="#FFFFFF"/>
  <g transform="translate(35, 30) scale(0.75)">
    <!-- Globe Wireframe -->
    <g stroke="#1F3D5C" stroke-width="8" fill="none" opacity="0.8">
      <circle cx="280" cy="200" r="150"/>
      <ellipse cx="280" cy="200" rx="150" ry="55"/>
      <ellipse cx="280" cy="200" rx="65" ry="150"/>
      <line x1="280" y1="50" x2="280" y2="350"/>
    </g>
    <!-- Cart Wireframe -->
    <path d="M 90 120 L 130 120 L 190 280 C 195 300, 215 315, 235 315 L 400 315 L 440 180 L 160 180"
