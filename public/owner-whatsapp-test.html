<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UDECS isolated owner test</title><style>body{font:17px system-ui;background:#f5f5f5;max-width:780px;margin:36px auto;padding:24px;color:#15202b}button{padding:12px 18px;margin:8px 8px 8px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:18px;border:1px solid #bbb}p{line-height:1.6}</style><h1>UDECS isolated owner test</h1><p>Customer dispatch stays OFF. This sample creates no real order, payment, stock change or shipment. One send only, no automatic retry.</p><pre id="preview">Sign into the owner Staff Portal. Read test status to show the approved private sample.</pre><button id="ready">Check current English template</button><button id="status">Read test status</button><button id="prepare">Prepare approved isolated fixture</button><button id="send">Submit one approved test</button><pre id="result">No request made.</pre><script type="module">
const API='https://udecs-orders-api.sksaharukhossain1996.workers.dev/api/whatsapp/owner-test';
let scope,hash;
async function ownerToken(){const rq=indexedDB.open('firebaseLocalStorageDb');const db=await new Promise((y,n)=>{rq.onsuccess=()=>y(rq.result);rq.onerror=()=>n(rq.error)});const r=db.transaction('firebaseLocalStorage','readonly').objectStore('firebaseLocalStorage').getAll();const vals=await new Promise((y,n)=>{r.onsuccess=()=>y(r.result);r.onerror=()=>n(r.error)});const u=vals.find(x=>x.fbase_key?.startsWith('firebase:authUser:'))?.value;if(!u||u.emailVerified!==true||!['sksaharukhossain1996@gmail.com','ecommerceunickdigital@gmail.com'].includes(u.email)||Date.now()>=u.stsTokenManager?.expirationTime)throw Error('Sign into your owner Staff Portal, then return here.');return u.stsTokenManager.accessToken;}
async function run(path,method){const buttons=[...document.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);try{if(method==='POST'&&(!scope||!hash))throw Error('Read test status first.');const r=await fetch(API+path,{method,headers:{Authorization:'Bearer '+await ownerToken(),'Content-Type':'application/json'},...(method==='POST'?{body:JSON.stringify({testId:scope.testId,scopeHash:hash})}:{})});const data=await r.json();if(r.ok&&data.scope){scope=data.scope;hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(JSON.stringify(scope)))),x=>x.toString(16).padStart(2,'0')).join('');document.getElementById('preview').textContent=JSON.stringify(scope,null,2)}document.getElementById('result').textContent='HTTP '+r.status+'\n'+JSON.stringify(data,null,2)}catch(e){document.getElementById('result').textContent='Request not confirmed. Do not retry send. '+e.message}finally{buttons.forEach(b=>b.disabled=false)}}
document.getElementById('ready').onclick=()=>run('/readiness','GET');document.getElementById('status').onclick=()=>run('/status','GET');document.getElementById('prepare').onclick=()=>run('/prepare','POST');document.getElementById('send').onclick=()=>{if(scope&&confirm('Submit exactly one approved synthetic message to '+scope.recipient+'? Customer dispatch remains OFF.'))run('','POST')};
</script></html>
