<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UDECS app password setup</title><style>body{margin:0;background:#17385b;color:#17385b;font:16px Arial}main{max-width:480px;margin:8vh auto;background:#fff;border-radius:16px;padding:30px}input,button{box-sizing:border-box;width:100%;padding:12px;margin:8px 0 16px;border:1px solid #b5cbe2;border-radius:8px}button{background:#17385b;color:white;font-weight:bold}p{line-height:1.5}#message{overflow-wrap:anywhere}</style><main><h1>UDECS app password</h1><p>Add a separate password to your existing owner account. This does not change your Gmail password or Firebase user ID.</p><p id="identity">Checking owner sign-in...</p><button id="google">Sign in as existing owner with Google</button><button id="verify" hidden>Send verification email to this login address</button><button id="refresh" hidden>Re-check email verification</button><button id="logout" hidden>Sign out of setup</button><form id="form" hidden><label>New app password<input id="password" type="password" autocomplete="new-password" required minlength="12"></label><label>Confirm new password<input id="confirm" type="password" autocomplete="new-password" required minlength="12"></label><button id="save">Add app password to this owner account</button></form><p id="message" role="status"></p><p>No public signup. Existing password credentials are not overwritten by this screen.</p></main><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';import{getAuth,onAuthStateChanged,GoogleAuthProvider,signInWithPopup,EmailAuthProvider,linkWithCredential,signOut,sendEmailVerification}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';const app=initializeApp({apiKey:'AIzaSyANRNCASxjGE-IZSLdCws_6W4VpjemO1aI',authDomain:'udecs-store.firebaseapp.com',projectId:'udecs-store',appId:'1:859203239571:web:9ebdafe1c6a28ad2a41766'});const auth=getAuth(app),owners=['ecommerceunickdigital@gmail.com','sksaharukhossain1996@gmail.com'];const $=id=>document.getElementById(id);function show(u){const known=!!u&&owners.includes(u.email),ok=known&&u.emailVerified,linked=known&&u.providerData.some(p=>p.providerId==='password');$('identity').textContent=known?'Signed in: '+u.email+' | '+(u.email===owners[0]?'Admin':'Founder/HR')+' | Email '+(u.emailVerified?'verified':'verification required'):'Sign in with your existing owner account.';$('form').hidden=!ok||linked;$('google').hidden=known;$('verify').hidden=!known||u.emailVerified;$('refresh').hidden=!known;$('logout').hidden=!known}onAuthStateChanged(auth,show);$('logout').onclick=()=>signOut(auth);$('refresh').onclick=async()=>{const u=auth.currentUser;if(u){await u.reload();await u.getIdToken(true);show(u);$('message').textContent=u.emailVerified?'Email verified. Password provider: '+(u.providerData.some(p=>p.providerId==='password')?'linked':'not linked'):'Email verification is still required.'}};$('verify').onclick=async()=>{const u=auth.currentUser;if(!u||!owners.includes(u.email)||u.emailVerified)return;$('verify').disabled=true;try{await sendEmailVerification(u);$('message').textContent='Verification email sent to '+u.email+'. Open that email, then re-check verification.'}catch{$('message').textContent='Verification email send was not confirmed. Do not repeat before checking inbox.'}};$('google').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch{$('message').textContent='Owner sign-in failed. Try normal browser sign-in.'}};$('form').onsubmit=async e=>{e.preventDefault();const u=auth.currentUser,p=$('password').value;if(!u?.emailVerified||!owners.includes(u.email)){return}if(p!==$('confirm').value||p.length<12){$('message').textContent='Passwords must match and have at least 12 characters.';return}if(u.providerData.some(p=>p.providerId==='password')){$('message').textContent='Password already linked. Nothing overwritten.';$('password').value='';$('confirm').value='';return}const uid=u.uid,email=u.email;$('save').disabled=true;try{const r=await linkWithCredential(u,EmailAuthProvider.credential(email,p));await r.user.reload();if(r.user.uid!==uid||r.user.email!==email||!r.user.providerData.some(p=>p.providerId==='password'))throw Error();show(r.user);$('message').textContent='App password linked. Existing owner UID preserved. '+email+'. '+(r.user.emailVerified?'Email verified.':'Email verification is required before desktop owner access.');$('form').hidden=true}catch{$('message').textContent='Linking was not confirmed. No password is shown. Re-check account providers before retrying.'}finally{$('password').value='';$('confirm').value='';$('save').disabled=false}};
</script></html>
