name: Stage approved quotation source and isolated service
on:
  push:
    branches: [quotation-approved-20261009]
    paths: [quotation-source-stage.b64, quotation-final-fixes.b64, .github/workflows/quotation-stage-expand.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: quotation-stage-expand
  cancel-in-progress: false
jobs:
  quotation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Expand scoped source
        run: |
          cp package-lock.json /tmp/quotation-baseline-lock.json
          base64 -d quotation-source-stage.b64 > quotation-source-stage.tar.gz
          echo "fd54f15b54dc7ff4c9135fe0f39961430e275bd6fdfb44d0064e5b7fd8aada5e  quotation-source-stage.tar.gz" | sha256sum -c -
          tar -xzf quotation-source-stage.tar.gz
          rm -f .github/workflows/.github/workflows/quotation-stage-expand.yml
          cp /tmp/quotation-baseline-lock.json package-lock.json
          if [ -f quotation-final-fixes.b64 ]; then
            base64 -d quotation-final-fixes.b64 > /tmp/quotation-final-fixes.tar.gz
            echo "ee495e0788dde55f94127118480b4f4de3046648637ed063cb9c1c40a9d659b3  /tmp/quotation-final-fixes.tar.gz" | sha256sum -c -
            tar -xzf /tmp/quotation-final-fixes.tar.gz
          fi
          npm install --package-lock-only --ignore-scripts
          npm ci
          npx tsx --test tests/quotation.test.ts tests/quotation-import.test.ts
          node --test tests/quotation-worker.test.mjs tests/quotation-integration.test.mjs
          npx tsc --noEmit
          npm run build
      - name: Commit tested source to staging branch only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -u .github/workflows
          git add package.json package-lock.json quotation-worker src/quotation src/components/admin/AdminPortal.tsx src/components/admin/AdminRfqInbox.tsx src/components/admin/AdminSidebar.tsx vite.config.ts quotation.html public/quotation-letterhead.jpg public/quotation-mark.jpg tests/quotation*.ts tests/quotation*.mjs
          git commit -m "Expand tested approved quotation stage" || test -z "$(git status --porcelain --untracked-files=no)"
          git push origin HEAD:quotation-approved-20261009
      - name: Deploy separate free quotation Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: bfa14054934d0f067511f26979c971d4
        run: npx wrangler deploy --config quotation-worker/wrangler.json
