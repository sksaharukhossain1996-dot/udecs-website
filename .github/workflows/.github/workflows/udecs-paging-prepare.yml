name: Prepare tested owner review paging fix
on:
  push:
    branches: [udecs-paging-20261010]
    paths: [.github/workflows/udecs-paging-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply tested narrow patch
        run: |
          echo '' | base64 -d > src/workflow-stage/WorkflowPanel.tsx
          echo '' | base64 -d > src/workflow-stage/paging.ts
          echo '' | base64 -d > src/workflow-stage/readSources.ts
          echo '' | base64 -d > src/resilience-stage/ResiliencePanel.tsx
          echo '' | base64 -d > tests/workflowPaging.test.ts
          rm .github/workflows/udecs-paging-prepare.yml
          npm ci
          npx tsx --test tests/workflowPaging.test.ts
          npx tsc --noEmit
          npm run build
      - name: Commit source changes on patch branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/workflow-stage src/resilience-stage/ResiliencePanel.tsx tests/workflowPaging.test.ts .github/workflows/udecs-paging-prepare.yml
          git commit -m "Fix complete paged owner summaries and published rules copy"
          git push origin HEAD:udecs-paging-20261010
