name: Prepare approved UDECS private review release
on:
  push:
    branches: [udecs-approved-20261010]
    paths: [udecs-release-source.b64, .github/workflows/udecs-stage-expand.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Expand frozen approved source
        run: |
          base64 -d udecs-release-source.b64 > /tmp/udecs-release-source.tar.gz
          echo "899c083449e2c064d4edf119625ea0f7322421e5e90354336dba04c5aee478dc  /tmp/udecs-release-source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/udecs-release-source.tar.gz
          rm udecs-release-source.b64 .github/workflows/udecs-stage-expand.yml .github/workflows/.github/workflows/udecs-stage-expand.yml
          npm ci
          npx tsc --noEmit
          npm run build
      - name: Commit scoped source on staging branch only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Prepare approved private GST and business review modules"
          git push origin HEAD:udecs-approved-20261010
