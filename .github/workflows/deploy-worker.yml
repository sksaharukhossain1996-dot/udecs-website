name: Deploy isolated disabled English owner-test routes
on:
  push:
    branches: [main]
    paths: [worker-production/**, .github/workflows/deploy-worker.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: udecs-api-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check reviewed paused artifacts
        run: |
          node --check worker-production/worker-production/production.mjs
          node --check worker-production/orders-paused.mjs
          node -e "const fs=require('fs'),c=require('crypto');for(const [p,h] of [['worker-production/worker-production/production.mjs','52bb3e06a3fcaf97bdec5584991afd1597441c723241d7eea50e2221f69144cb'],['worker-production/orders-paused.mjs','266d9ec64191ebe7cb4b38ba6d4cc3b174369e00c28866a3ce3595dc020af0c4']])if(c.createHash('sha256').update(fs.readFileSync(p)).digest('hex')!==h)throw Error('Reviewed source changed');for(const p of ['orders-paused.json','wrangler.json']){const j=JSON.parse(fs.readFileSync('worker-production/'+p));if(j.vars.WHATSAPP_ORDER_MODE!=='off'||j.vars.WHATSAPP_OWNER_TEST_ENABLED!=='false')throw Error('Sending must stay off');if(p.startsWith('orders-')&&(j.vars.ENABLED!=='true'||j.vars.CUSTOMER_PAYU_ENABLED!=='true'||j.vars.ORDER_ALERTS_ENABLED!=='true'||j.triggers.crons.join()!=='17 * * * *'))throw Error('Order settings changed')}"
      - name: Dry runs without upload
        run: |
          npx wrangler deploy --config worker-production/wrangler.json --no-bundle --keep-vars --dry-run
          npx wrangler deploy --config worker-production/orders-paused.json --no-bundle --keep-vars --dry-run
      - name: Deploy paused private entrypoints and bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: bfa14054934d0f067511f26979c971d4
        run: |
          npx wrangler deploy --config worker-production/wrangler.json --no-bundle --keep-vars
          npx wrangler deploy --config worker-production/orders-paused.json --no-bundle --keep-vars
